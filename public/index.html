<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WeShare Online</title>
</head>
<body>
  <div id="root"></div>
  <script type="module">
  // Firebase core
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.3.0/firebase-analytics.js";
  
  // Firebase Auth
  import { getAuth, signInWithPopup, signInWithEmailAndPassword, GoogleAuthProvider, FacebookAuthProvider, OAuthProvider } 
    from "https://www.gstatic.com/firebasejs/12.3.0/firebase-auth.js";

  // Your Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyAx-eKZKr1eYVGCrgr_KLUbmzw-R5v_2Q8",
    authDomain: "we---share.firebaseapp.com",
    projectId: "we---share",
    storageBucket: "we---share.firebasestorage.app",
    messagingSenderId: "538513608847",
    appId: "1:538513608847:web:07141add92c86f8276e0fa",
    measurementId: "G-4684D064VV"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const auth = getAuth(app);

  // Providers
  const googleProvider = new GoogleAuthProvider();
  const facebookProvider = new FacebookAuthProvider();
  const microsoftProvider = new OAuthProvider("microsoft.com");

  // Example login function
  async function loginWithProvider(provider) {
    try {
      const result = await signInWithPopup(auth, provider);
      const token = await result.user.getIdToken();

      // Send token to PHP API
      const response = await fetch("https://yourdomain.infinityfreeapp.com/api/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });
      const data = await response.json();
      console.log("Backend response:", data);
    } catch (err) {
      console.error("Login error:", err);
    }
  }

  // Attach buttons (replace IDs with your HTML buttons)
  document.getElementById("googleLoginBtn")?.addEventListener("click", () => loginWithProvider(googleProvider));
  document.getElementById("facebookLoginBtn")?.addEventListener("click", () => loginWithProvider(facebookProvider));
  document.getElementById("microsoftLoginBtn")?.addEventListener("click", () => loginWithProvider(microsoftProvider));

  // Email login example
  async function loginWithEmail(email, password) {
    try {
      const result = await signInWithEmailAndPassword(auth, email, password);
      const token = await result.user.getIdToken();

      const response = await fetch("https://yourdomain.infinityfreeapp.com/api/login.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });
      const data = await response.json();
      console.log("Email login backend response:", data);
    } catch (err) {
      console.error("Email login error:", err);
    }
  }

  // Example usage for email login
  // loginWithEmail("user@example.com", "plaintextpassword");

</script>
</body>
</html>
